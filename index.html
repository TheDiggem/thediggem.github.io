<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Diggem — Texas • Eerie • Real</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --mesquite:#0B0B0B; --bone:#EDE7DF; --chili:#B03A2E;
    }
    body { background:var(--mesquite); color:var(--bone); font-family:"Atkinson Hyperlegible", sans-serif; }
    .hheading { font-family:"Cinzel", serif; }
  </style>
</head>
<body class="antialiased">

  <!-- Header -->
  <header class="bg-black/70 border-b border-white/10">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="/" class="hheading text-xl">THE DIGGEM</a>
      <nav class="space-x-4 text-sm hidden md:block">
        <a href="#about" class="hover:text-[--chili]">About</a>
        <a href="#shop" class="hover:text-[--chili]">Shop</a>
        <a href="#contact" class="hover:text-[--chili]">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <section class="relative min-h-[70vh] flex items-center justify-center text-center">
    <img src="/images/texas-night-highway.jpg" alt="Texas highway at night" class="absolute inset-0 w-full h-full object-cover opacity-60">
    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
    <div class="relative z-10 max-w-2xl px-4">
      <h1 class="hheading text-4xl md:text-6xl font-bold">Texas • Eerie • Real</h1>
      <p class="mt-4 text-lg text-white/80">Stories from the road, threads with a pulse.</p>
      <div class="mt-6 flex gap-4 justify-center">
        <a href="#shop" class="px-5 py-3 bg-[--chili] rounded-lg font-semibold">Shop</a>
        <a href="#about" class="px-5 py-3 border border-white/30 rounded-lg">Learn More</a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="border-t border-white/10 py-6 text-center text-sm text-white/60">
    © <span id="y"></span> The Diggem — Texas
  </footer>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
  </script>
</body>
</html>
