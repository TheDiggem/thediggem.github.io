<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="The Diggem | Unleash Your Edge">
  <meta property="og:description" content="Unleash Your Edge with Texas-inspired toxic streetwear, podcasts, and bold ideas. Explore our take on parenting licenses and shop at thediggem.com!">
  <meta property="og:image" content="https://thediggem.com/TDlogo.png">
  <meta property="og:url" content="https://thediggem.com">
  <meta property="og:type" content="website">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <title>The Diggem | Unleash Your Edge</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat&family=Impact&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Bebas Neue', sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      overflow: hidden;
    }
    .container {
      padding: 20px;
      max-width: 600px;
    }
    .logo-primary {
      max-width: 200px;
      margin-bottom: 20px;
      position: relative;
    }
    .logo-primary::before {
      content: '';
      position: absolute;
      top: -25px;
      left: -25px;
      right: -25px;
      bottom: -25px;
      background-color: #2F4F2F;
      border-radius: 50%;
      animation: toxic-glow 1.5s ease-in-out infinite;
      z-index: -1;
      opacity: 0.85;
    }
    .logo-secondary {
      max-width: 100px;
      margin: 5px;
      position: relative;
    }
    .logo-secondary::before {
      content: '';
      position: absolute;
      top: -25px;
      left: -25px;
      right: -25px;
      bottom: -25px;
      background-color: #2F4F2F;
      border-radius: 50%;
      animation: toxic-glow 1.5s ease-in-out infinite;
      z-index: -1;
      opacity: 0.85;
    }
    .logo-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }
    p {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5em;
      margin: 20px 0;
      color: #fff;
    }
    .signup-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 20px 0;
    }
    input {
      padding: 10px;
      background-color: #333;
      border: none;
      color: #fff;
      border-radius: 5px;
      font-family: 'Montserrat', sans-serif;
      font-size: 1em;
    }
    button {
      background-color: #e63946;
      color: #fff;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1.2em;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #f48c06;
    }
    .article-link {
      position: relative;
      display: inline-block;
      margin-top: 16px;
    }
    .article-button {
      background-color: #2F4F2F;
      color: #fff;
      padding: 12px 24px;
      border: none;
      border-radius: 0;
      cursor: pointer;
      font-family: 'Impact', sans-serif;
      font-size: 1.3em;
      letter-spacing: 0.05em;
      position: relative;
      transition: background-color 0.3s, transform 0.2s;
    }
    .article-button:hover {
      background-color: #4CAF50;
      transform: scale(1.05);
    }
    .article-button::before, .article-button::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(45deg, #355E3B, #2F4F2F);
    }
    .article-button::before {
      top: -4px;
      clip-path: polygon(0 0, 10% 100%, 90% 100%, 100% 0);
    }
    .article-button::after {
      bottom: -4px;
      clip-path: polygon(0 100%, 10% 0, 90% 0, 100% 100%);
    }
    .article-link::before {
      content: '';
      position: absolute;
      top: -12px;
      left: -12px;
      right: -12px;
      bottom: -12px;
      background-color: #2F4F2F;
      animation: toxic-glow 1.5s ease-in-out infinite;
      z-index: -1;
      opacity: 0.85;
    }
    @keyframes toxic-glow {
      0% { box-shadow: 0 0 30px #355E3B, 0 0 40px #2F4F2F; }
      50% { box-shadow: 0 0 60px #355E3B, 0 0 70px #2F4F2F; }
      100% { box-shadow: 0 0 30px #355E3B, 0 0 40px #2F4F2F; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="TDlogo.png" class="logo-primary" alt="The Diggem TD Logo">
    <div class="logo-grid">
      <a href="https://www.amazon.com/s?rh=n%3A7141123011%2Cp_4%3AThe%2BDiggem%2BClothing&ref=bl_sl_s_ap_web_7141123011" target="_blank"><img src="WBSTheDiggemClothingLogo001.png" class="logo-secondary" alt="WBS The Diggem Clothing Logo"></a>
      <a href="https://www.youtube.com/@TheDiggemGaming" target="_blank"><img src="WBSTheDiggemGamingLogo001.png" class="logo-secondary" alt="WBS The Diggem Gaming Logo"></a>
      <a href="https://www.youtube.com/@TheDiggemOfficial" target="_blank"><img src="WBSTheDiggemyoutubeLogo001.png" class="logo-secondary" alt="WBS The Diggem YouTube Logo"></a>
      <a href="https://www.amazon.com/s?rh=n%3A7141123011%2Cp_4%3AArtifacted%2BThreads&ref=bl_sl_s_ap_web_7141123011" target="_blank"><img src="WBSArtifactedThreadsLogo001.png" class="logo-secondary" alt="WBS Artifacted Threads Logo"></a>
    </div>
    <p>Unleash Your Edge. Coming Soon! 🔥</p>
    <form class="signup-form" action="https://your-mailchimp-form-url" method="post">
      <input type="email" placeholder="Enter your email for updates" required>
      <button type="submit">Join the Rebellion</button>
    </form>
    <a href="https://thediggem.github.io/parenting-license.html" class="article-link">
      <button class="article-button">Think parenting’s a free-for-all? Read this — A Diggem Original</button>
    </a>
  </div>
</body>
</html>
