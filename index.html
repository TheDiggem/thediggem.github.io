<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="The Diggem | Coming Soon">
  <meta property="og:description" content="Unleash Your Edge with Texas-inspired toxic streetwear and podcasts. Shop at thediggem.com! 🔥">
  <meta property="og:image" content="https://thediggem.com/TDlogo.png"> <!-- Update with your hosted URL -->
  <meta property="og:url" content="https://thediggem.com">
  <meta property="og:type" content="website">
  <title>The Diggem | Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Bebas Neue', sans-serif;
      background: #1a1a1a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }
    .container {
      padding: 20px;
      max-width: 600px;
    }
    .logo-primary {
      max-width: 200px;
      margin-bottom: 10px;
    }
    .logo-secondary {
      max-width: 100px;
      margin: 5px;
      position: relative;
    }
    .logo-secondary::before {
      content: '';
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      background: linear-gradient(45deg, #355E3B, #2F4F2F, #355E3B); /* Toxic green sludge gradient */
      -webkit-background-clip: padding-box;
      background-clip: padding-box;
      border-radius: 50%;
      animation: toxic-glow 2s ease-in-out infinite;
      z-index: -1;
    }
    .logo-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 3.5em;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #f48c06; /* Neon orange for legibility */
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7); /* Depth for readability */
      font-family: 'Bebas Neue', sans-serif;
    }
    p {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5em;
      margin: 20px 0;
      color: #fff;
    }
    .signup-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 20px 0;
    }
    input {
      padding: 10px;
      background: #333;
      border: none;
      color: #fff;
      border-radius: 5px;
      font-family: 'Montserrat', sans-serif;
      font-size: 1em;
    }
    button {
      background: #e63946;
      color: #fff;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1.2em;
      transition: background 0.3s;
    }
    button:hover {
      background: #f48c06;
    }
    @keyframes toxic-glow {
      0% { box-shadow: 0 0 10px #355E3B, 0 0 20px #2F4F2F; }
      50% { box-shadow: 0 0 20px #355E3B, 0 0 30px #2F4F2F; }
      100% { box-shadow: 0 0 10px #355E3B, 0 0 20px #2F4F2F; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="TDlogo.png" class="logo-primary" alt="The Diggem TD Logo">
    <div class="logo-grid">
      <a href="https://www.amazon.com/s?rh=n%3A7141123011%2Cp_4%3AThe%2BDiggem%2BClothing&ref=bl_sl_s_ap_web_7141123011" target="_blank"><img src="WBSTheDiggemClothingLogo001.png" class="logo-secondary" alt="WBS The Diggem Clothing Logo"></a>
      <a href="https://www.youtube.com/@TheDiggemGaming" target="_blank"><img src="WBSTheDiggemGamingLogo001.png" class="logo-secondary" alt="WBS The Diggem Gaming Logo"></a>
      <a href="https://www.youtube.com/@TheDiggemOfficial" target="_blank"><img src="WBSTheDiggemyoutubeLogo001.png" class="logo-secondary" alt="WBS The Diggem YouTube Logo"></a>
      <a href="https://www.amazon.com/s?rh=n%3A7141123011%2Cp_4%3AArtifacted%2BThreads&ref=bl_sl_s_ap_web_7141123011" target="_blank"><img src="WBSArtifactedThreadsLogo001.png" class="logo-secondary" alt="WBS Artifacted Threads Logo"></a>
    </div>
    <h1>The Diggem</h1>
    <p>Unleash Your Edge. Coming Soon! 🔥</p>
    <form class="signup-form" action="https://your-mailchimp-form-url" method="post">
      <input type="email" placeholder="Enter your email for updates" required>
      <button type="submit">Join the Rebellion</button>
    </form>
  </div>
</body>
</html>
