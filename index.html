<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Diggem — Under Construction</title>
  <meta name="description" content="The Diggem is getting an upgrade. Come back soon." />

  <!-- Open Graph / Facebook -->
  <meta property="og:title" content="The Diggem — Under Construction" />
  <meta property="og:description" content="The Diggem is getting an upgrade. Come back soon." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://thediggem.github.io/" />
  <meta property="og:image" content="https://thediggem.github.io/og-image.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="The Diggem — Under Construction" />
  <meta name="twitter:description" content="The Diggem is getting an upgrade. Come back soon." />
  <meta name="twitter:image" content="https://thediggem.github.io/og-image.png" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://thediggem.github.io/" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0c;
      color: #f2f2f2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      background: radial-gradient(circle at center, #1a1a1d 0%, #0b0b0c 100%);
      padding: 20px;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #d9a441;
    }
    p {
      color: #b5b8bd;
      max-width: 500px;
      font-size: 1.1rem;
    }
    .logo {
      font-size: 5rem;
      margin-bottom: 1.5rem;
    }
    .og-image {
      max-width: 100%;
      height: auto;
      margin: 20px 0;
      border: 3px solid #22242a;
      border-radius: 8px;
    }
    form {
      margin-top: 2rem;
      background: #121317;
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
      width: 100%;
      border: 1px solid #22242a;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
      border: none;
      background: #0b0b0c;
      color: #fff;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      background: #d9a441;
      color: #000;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #b98b36;
    }
  </style>
</head>
<body>
  <div class="logo">🚧</div>
  <h1>Under Construction</h1>
  <img src="https://thediggem.github.io/og-image.png" alt="The Diggem" class="og-image">
  <p>The Diggem is getting an upgrade.<br>Check back soon for the full experience.</p>

  <!-- Contact Form -->
  <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <h2>Contact Me</h2>
    <input type="text" name="name" placeholder="Your Name" required>
    <input type="email" name="_replyto" placeholder="Your Email" required>
    <textarea name="message" placeholder="Your Message" rows="4" required></textarea>
    <button type="submit">Send</button>
  </form>
</body>
</html>
