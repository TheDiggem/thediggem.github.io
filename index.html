<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Diggem — Texas • Eerie • Real</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0b0b;--fg:#ede7df;--chili:#b03a2e}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"Atkinson Hyperlegible",system-ui,Segoe UI,Roboto,Arial,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:0 16px}
  header{border-bottom:1px solid #fff2;background:rgba(0,0,0,.6)}
  .bar{height:56px;display:flex;align-items:center;justify-content:space-between}
  .brand{font-family:"Cinzel",serif;font-weight:700;letter-spacing:.04em}
  .btn{display:inline-block;padding:10px 14px;border:1px solid #fff3;border-radius:10px}
  .btn--primary{background:var(--chili);border-color:transparent;font-weight:700}
  .hero{position:relative;min-height:70vh;display:grid;place-items:center;text-align:center;overflow:hidden}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6}
  .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000,rgba(0,0,0,.4) 55%,transparent)}
  .hero > .inner{position:relative;z-index:1;padding:24px}
  footer{border-top:1px solid #fff2;text-align:center;padding:16px;color:#fff9}
</style>

<body>
  <header>
    <div class="wrap bar">
      <a href="/" class="brand">THE DIGGEM</a>
      <nav class="hide-sm">
        <a class="btn" href="#about">About</a>
        <a class="btn" href="#shop">Shop</a>
        <a class="btn" href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <!-- swap this image path when you’re ready -->
    <img src="/images/texas-night-highway.jpg" alt="Texas highway at night">
    <div class="inner wrap">
      <h1 class="brand" style="font-size:2.5rem;margin:0 0 .5rem">Texas • Eerie • Real</h1>
      <p style="opacity:.9">Stories from the road, threads with a pulse.</p>
      <p style="margin-top:14px">
        <a class="btn btn--primary" href="#shop">Shop</a>
        <a class="btn" href="#about">Learn more</a>
      </p>
    </div>
  </section>

  <footer>© <span id="y"></span> The Diggem — Texas</footer>
  <script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
